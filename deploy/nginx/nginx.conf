user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

# The public :2000 listener identifies TLS before forwarding traffic. This lets
# plain HTTP receive a redirect while HTTPS is terminated by the certificate
# endpoint, without exposing a second public application port.
stream {
    map $ssl_preread_protocol $xianyusmart_2000_upstream {
        ""      127.0.0.1:2002;
        default 127.0.0.1:2001;
    }

    server {
        listen 2000;
        ssl_preread on;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
        proxy_pass $xianyusmart_2000_upstream;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
