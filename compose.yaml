name: xianyusmart

services:
  mysql:
    image: mysql:5.7.18
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MYSQL_DATABASE: ${DB_NAME:-xianyusmart}
      MYSQL_USER: ${DB_USERNAME:-xianyusmart}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=100
      # Flyway V3 creates tenant-normalization triggers. MySQL with binary logging
      # rejects trigger creation by the application user unless this is enabled.
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql57-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - xianyusmart

  app:
    build:
      context: .
    image: ${APP_IMAGE:-xianyusmart:2.0.7}
    restart: unless-stopped
    mem_limit: 3g
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-xianyusmart}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&sslMode=DISABLED
      DB_USERNAME: ${DB_USERNAME:-xianyusmart}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCOUNT_DATA_ENCRYPTION_KEY: ${ACCOUNT_DATA_ENCRYPTION_KEY:?ACCOUNT_DATA_ENCRYPTION_KEY is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:2000,http://127.0.0.1:2000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      UPDATE_RELEASE_API: ${UPDATE_RELEASE_API:-https://api.github.com/repos/Evvvvvvvan/XianYuSmart/releases/latest}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20 -XX:+ExitOnOutOfMemoryError}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:12400/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - xianyusmart

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "2000:2000"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - xianyusmart

volumes:
  mysql-data:
  mysql57-data:
    name: xianyusmart_mysql57-data-recovered
  app-data:
  app-logs:

networks:
  xianyusmart:
    driver: bridge
